# 高低压成套设备招投标监控系统 - 配置文件
# 
# 安全提示：敏感信息（API Key、邮箱密码等）请勿填写在此文件中！
# 请在项目根目录创建 .env 文件，填入敏感信息：
#   DEEPSEEK_API_KEY=your-api-key
#   EMAIL_SMTP_PASSWORD=your-auth-code
#
# .env 文件已被 Git 忽略，不会泄露到代码仓库中。

keywords:
  include:
    - 高低压成套设备
    - 开关柜
    - 配电柜
    - 箱式变电站
    - 环网柜
    - KYN28
    - GGD
    - GCK
  exclude:
    - 设计
    - 监理
    - 咨询
    - 清洗
    - 运输
  must_contain: []

crawler:
  enabled_sites:
    - ccgp
    - chinabidding
    - ebnew
    - plap
  use_selenium: false
  timeout: 30
  request_delay: 5
  max_retries: 3

# 邮箱配置：只填非敏感字段，密码请放在 .env 的 EMAIL_SMTP_PASSWORD 中
email:
  smtp_server: smtp.qq.com
  smtp_port: 465
  use_ssl: true
  sender: ""
  password: ""      # 从 .env 的 EMAIL_SMTP_PASSWORD 读取
  receiver: ""

schedule:
  interval_minutes: 30
  run_immediately: false

logging:
  level: INFO

# ---- AI 智能过滤配置 (V2 - 多Provider管理模式) ----
# 从 GUI 的「管理 Provider 配置」界面配置后自动保存
# 支持 50+ 内置预设：OpenAI、Claude、Gemini、DeepSeek、Kimi、GLM、
# 通义千问、讯飞星火、文心一言、豆包、OpenRouter、API2D、硅基流动 等
ai:
  enable: false
  active_provider_id: ""
  providers: []
  prompt: ""
